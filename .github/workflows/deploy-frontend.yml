name: Deploy frontend (Firebase Hosting)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: lsr-digital-architecture

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm check:all

      - name: Test
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build
        env:
          # Override via repo variable VITE_API_URL if needed; default is api subdomain
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.loghan-ramassamy.fr' }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/344658308078/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@lsr-digital-architecture.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy preview to Firebase Hosting (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          npx --yes firebase-tools hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --only tools \
            --project ${{ env.FIREBASE_PROJECT }} \
            --expires 7d
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy to Firebase Hosting (Live)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx --yes firebase-tools deploy --only hosting:tools \
            --project ${{ env.FIREBASE_PROJECT }} \
            --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
